name: VARIADO prueba subtitulos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-inter python3-pil python3-fonttools
      - name: Fuente de subtitulos (Barlow Condensed)
        run: |
          mkdir -p ~/.fonts
          curl -fsSL --retry 3 -o ~/.fonts/BarlowCondensed-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf" || echo "No se pudo bajar Barlow Condensed; se usara Inter Bold"
          fc-cache -f || true
          fc-list | grep -i "barlow" || true
      - name: Probar
        run: python3 test_subs.py
      - name: Guardar vista previa
        run: |
          git config user.name "variado-bot"
          git config user.email "variado-bot@users.noreply.github.com"
          git add previews
          git commit -m "vista previa subtitulos"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -q origin main && git push -q; then break; fi
            sleep $((RANDOM % 8 + 3))
          done
