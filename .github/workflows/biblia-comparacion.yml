name: VARIADO biblia cinematografica - comparison
on:
  push:
    paths:
      - 'bibliajobs/**/job.json'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Check ffmpeg (preinstalled on hosted runners)
        run: ffmpeg -version | head -1
      - name: Render biblia comparison at 60 fps
        run: |
          python3 -m pip install --break-system-packages -q numpy edge-tts || python3 -m pip install -q numpy edge-tts
          npm --prefix remotion ci --no-audit --no-fund
          JOB=$(find bibliajobs -mindepth 2 -maxdepth 2 -name job.json | sort | tail -1)
          test -n "$JOB"
          ID=$(basename "$(dirname "$JOB")")
          echo "JOB_ID=$ID" >> "$GITHUB_ENV"
          python3 render_remotion.py "$JOB" "variado-$ID.mp4"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,duration -of default=nw=1 "variado-$ID.mp4"
      - name: Publish comparison MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |\n          gh release create "biblia-$JOB_ID" "variado-$JOB_ID.mp4" --title "VARIADO Biblia - $JOB_ID" --notes "Comparativa cinematografica con el video becario; misma narracion, voz y FPS. Realizada con Remotion 2.5D."
