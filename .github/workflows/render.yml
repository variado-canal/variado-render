name: VARIADO render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID del video (carpeta jobs/<id>)"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB_ID: ${{ inputs.job_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter python3-pil python3-fonttools
      - name: Fuente de subtitulos (Barlow Condensed)
        run: |
          mkdir -p ~/.fonts
          curl -fsSL --retry 3 -o ~/.fonts/BarlowCondensed-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf" || echo "No se pudo bajar Barlow Condensed; se usara Inter Bold"
          curl -sL -o ~/.fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf || true
          curl -sL -o ~/.fonts/Poppins-Medium.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf || true
          curl -sL -o ~/.fonts/Outfit.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/outfit/Outfit%5Bwght%5D.ttf" || true
          fc-cache -f || true
          fc-list | grep -i "barlow" || true
      - name: Renderizar video
        run: |
          if [[ "${JOB_ID}" == d* ]]; then SCRIPT=render_dinero.py; else SCRIPT=render.py; fi
          if grep -q '"motor"' "jobs/${JOB_ID}/job.json"; then
            python3 -m pip install --break-system-packages -q numpy edge-tts || python3 -m pip install -q numpy edge-tts
            python3 render_motion.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
          elif grep -q voz_edge "jobs/${JOB_ID}/job.json"; then
            python3 -m pip install --break-system-packages -q edge-tts || python3 -m pip install -q edge-tts
            RENDER_SCRIPT="${SCRIPT%.py}" python3 voz_edge.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
          else
            python3 "$SCRIPT" "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
          fi
      - name: Publicar video en Release
        run: gh release create "v-${JOB_ID}" "video-${JOB_ID}.mp4" --title "video-${JOB_ID}" --notes "VARIADO"
      - name: Limpiar paquete del repositorio
        run: |
          git config user.name "variado-bot"
          git config user.email "variado-bot@users.noreply.github.com"
          git rm -r -q "jobs/${JOB_ID}"
          git commit -m "limpiar jobs/${JOB_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -q origin main && git push -q; then break; fi
            sleep $((RANDOM % 8 + 3))
          done

