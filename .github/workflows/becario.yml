name: VARIADO becario skill 60 FPS
on:
  push:
    paths:
      - 'becariojobs/**/job.json'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Renderizar con voz original y Remotion 60fps
        run: |
          python3 -m pip install --break-system-packages -q numpy edge-tts || python3 -m pip install -q numpy edge-tts
          npm --prefix remotion ci --no-audit --no-fund
          JOB=$(find becariojobs -mindepth 2 -maxdepth 2 -name job.json | sort | tail -1)
          if [ -z "$JOB" ]; then echo 'No job detected'; exit 1; fi
          ID=$(basename $(dirname "$JOB"))
          echo "JOB_ID=$ID" >> "$GITHUB_ENV"
          python3 render_remotion.py "$JOB" "variado-$ID.mp4"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -of default=nw=1 "variado-$ID.mp4"
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "becario-$JOB_ID" "variado-$JOB_ID.mp4" --title "VARIADO - $JOB_ID" --notes "Reel educativo Variado. Reglas narrativas y de ritmo de becario-reels, Remotion a 60 FPS."
