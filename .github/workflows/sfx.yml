name: sfx
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 sfx_kenney.py
      - run: |
          git config user.name "sfx-bot"
          git config user.email "sfx-bot@users.noreply.github.com"
          git add remotion/public/sfx
          git commit -m "sfx: sonidos CC0 de Kenney por familia (13-nov)" || echo "sin cambios"
          git push